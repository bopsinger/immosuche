name: Tägliche Immobiliensuche

on:
  schedule:
    - cron: "17 5 * * *"   # täglich 05:17 UTC (06:17 Winterzeit / 07:17 Sommerzeit)
  workflow_dispatch:       # manuell auslösbar unter "Actions"
  push:                    # neue Suche von der Karte sofort ausführen
    branches: [main]
    paths: ["suche.yaml", "suche/**", "config.yaml"]

permissions:
  contents: write          # Zustand (bereits gemeldete Inserate) zurückschreiben

concurrency:
  group: immosuche
  cancel-in-progress: false

jobs:
  suche:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Suche ausführen und Mail senden
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          IMAP_HOST: ${{ secrets.IMAP_HOST || 'imap.gmail.com' }}
          VERSAND_ZEIT: "06:17"
        run: python -m immosuche
      - name: Zustand speichern
        if: always()
        run: |
          git config user.name "immosuche-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ daten.json schluessel/
          git diff --cached --quiet || git commit -m "Daten aktualisiert [skip ci]"
          git pull --rebase -q || true
          git push
